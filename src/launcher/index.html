<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Sofá</title>
<link rel="stylesheet" href="launcher.css">
</head>
<body>
  <div id="bg">
    <div class="bg-layer" id="bg-a"></div>
    <div class="bg-layer" id="bg-b"></div>
    <div class="bg-shade"></div>
  </div>

  <main id="home">
    <header>
      <div class="brand">sofá</div>
      <div class="status">
        <span class="stat" id="st-pad" title="Controles"><svg viewBox="0 0 24 24"><path d="M7 7h10a5 5 0 0 1 4.9 6l-.7 3.4a2.5 2.5 0 0 1-4.3 1.2L14.5 15h-5l-2.4 2.6a2.5 2.5 0 0 1-4.3-1.2L2.1 13A5 5 0 0 1 7 7Zm0 3v1.5H5.5v1H7V14h1v-1.5h1.5v-1H8V10H7Zm9.5.5a1 1 0 1 0 0 2 1 1 0 0 0 0-2Zm2 2a1 1 0 1 0 0 2 1 1 0 0 0 0-2Z"/></svg><b>0</b></span>
        <span class="stat" id="st-phone" title="Celulares conectados"><svg viewBox="0 0 24 24"><path d="M8 2h8a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Zm0 3v13h8V5H8Zm4 14.2a.9.9 0 1 0 0 1.8.9.9 0 0 0 0-1.8Z"/></svg><b>0</b></span>
        <span class="stat" id="st-cast" title="Pronto para transmitir"><svg viewBox="0 0 24 24"><path d="M3 5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6v-2h6V5H5v3H3V5Zm0 5a9 9 0 0 1 9 9h-2a7 7 0 0 0-7-7v-2Zm0 4a5 5 0 0 1 5 5H6a3 3 0 0 0-3-3v-2Zm0 4a1 1 0 0 1 1 1H3v-1Z"/></svg></span>
        <span class="stat" title="Comando de voz: botão do microfone do controle"><svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3Zm-7 9h2a5 5 0 0 0 10 0h2a7 7 0 0 1-6 6.9V21h-2v-3.1A7 7 0 0 1 5 11Z"/></svg></span>
        <time id="clock"></time>
      </div>
    </header>

    <section class="hero" id="hero">
      <div class="eyebrow"><img id="hero-icon" alt="" hidden><i class="dot"></i><span id="hero-eyebrow">Apps</span></div>
      <h1 id="hero-title">sofá</h1>
      <p class="meta" id="hero-meta"></p>
      <div class="progress" id="hero-progress"><i></i></div>
      <div class="chips" id="hero-chips"></div>
    </section>

    <aside class="remote-card">
      <img id="qr" alt="QR code do controle remoto">
      <div>
        <b>Controle no celular</b>
        <span id="remote-url"></span>
      </div>
    </aside>

    <section class="rows" id="rows"></section>
  </main>

  <div id="ambient" hidden>
    <div class="amb-bg"></div>
    <div class="amb-content">
      <time id="amb-clock"></time>
      <div class="amb-date" id="amb-date"></div>
      <div class="amb-cast">
        <div class="amb-pulse"><svg viewBox="0 0 24 24"><path d="M3 5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6v-2h6V5H5v3H3V5Zm0 5a9 9 0 0 1 9 9h-2a7 7 0 0 0-7-7v-2Zm0 4a5 5 0 0 1 5 5H6a3 3 0 0 0-3-3v-2Zm0 4a1 1 0 0 1 1 1H3v-1Z"/></svg></div>
        <div>
          <h2>Pronto para transmitir</h2>
          <p>No app do YouTube, toque em Transmitir e escolha <b class="dev-name">Sofá (PC)</b></p>
          <p class="muted">Qualquer botão do controle, do teclado ou do celular volta ao menu</p>
        </div>
      </div>
      <img id="amb-qr" alt="">
    </div>
  </div>

  <div id="toast" hidden></div>
  <script src="launcher.js"></script>
</body>
</html>
